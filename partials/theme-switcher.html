<div class="theme-switcher" role="group" aria-label="Darstellung auswählen">
  <div class="uk-button-group theme-switcher-group">
    <button class="uk-button uk-button-default uk-button-small" type="button" data-theme-preference="system" aria-pressed="true" aria-label="Systemdarstellung verwenden"><span class="theme-switcher-text">System</span></button>
    <button class="uk-button uk-button-default uk-button-small" type="button" data-theme-preference="light" aria-pressed="false" aria-label="Helles Erscheinungsbild"><span class="theme-switcher-text">Hell</span></button>
    <button class="uk-button uk-button-default uk-button-small" type="button" data-theme-preference="dark" aria-pressed="false" aria-label="Dunkles Erscheinungsbild"><span class="theme-switcher-text">Dunkel</span></button>
  </div>
</div>
