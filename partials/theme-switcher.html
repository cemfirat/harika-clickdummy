<div class="theme-switcher theme-switcher-compact" role="group" aria-label="Darstellung">
  <div class="uk-button-group theme-switcher-group">
    <button
      class="uk-button uk-button-default uk-button-small"
      type="button"
      data-theme-preference="light"
      aria-pressed="false"
      aria-label="Helles Erscheinungsbild"
      title="Hell"
    >
      <span data-uk-icon="icon: image; ratio: 0.85" aria-hidden="true"></span>
      <span class="theme-switcher-text">Hell</span>
    </button>
    <button
      class="uk-button uk-button-default uk-button-small"
      type="button"
      data-theme-preference="system"
      aria-pressed="true"
      aria-label="Automatisch nach Browser-Einstellung"
      title="Folgt der Hell-/Dunkel-Einstellung des Browsers"
    >
      <span data-uk-icon="icon: desktop; ratio: 0.85" aria-hidden="true"></span>
      <span class="theme-switcher-text">Auto</span>
    </button>
    <button
      class="uk-button uk-button-default uk-button-small"
      type="button"
      data-theme-preference="dark"
      aria-pressed="false"
      aria-label="Dunkles Erscheinungsbild"
      title="Dunkel"
    >
      <span data-uk-icon="icon: paint-bucket; ratio: 0.85" aria-hidden="true"></span>
      <span class="theme-switcher-text">Dunkel</span>
    </button>
  </div>
</div>
