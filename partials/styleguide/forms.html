<form class="uk-form-stacked">
  <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m" data-uk-grid>
    <div>
      <label class="uk-form-label" for="sg-name">Textfeld</label>
      <div class="uk-form-controls">
        <input id="sg-name" class="uk-input" type="text" value="AMBRA">
      </div>
    </div>
    <div>
      <label class="uk-form-label" for="sg-environment">Select</label>
      <div class="uk-form-controls">
        <select id="sg-environment" class="uk-select">
          <option>Produktion</option>
          <option>Staging</option>
        </select>
      </div>
    </div>
  </div>

  <div class="uk-margin">
    <label class="uk-form-label" for="sg-message">Textarea</label>
    <div class="uk-form-controls">
      <textarea id="sg-message" class="uk-textarea" rows="3">Direkt editierbares UIkit-Markup.</textarea>
    </div>
  </div>

  <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m" data-uk-grid>
    <div>
      <label class="uk-form-label" for="sg-success">Valid state</label>
      <input id="sg-success" class="uk-input uk-form-success" value="Verbunden">
    </div>
    <div>
      <label class="uk-form-label" for="sg-danger">Invalid state</label>
      <input id="sg-danger" class="uk-input uk-form-danger" value="Ungültiger Wert">
    </div>
  </div>

  <div class="uk-margin">
    <label><input class="uk-checkbox" type="checkbox" checked> Checkbox</label>
    <label class="uk-margin-left"><input class="uk-radio" type="radio" name="sg-radio" checked> Radio</label>
  </div>
</form>
